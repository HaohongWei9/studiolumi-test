<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudioLumi · test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --plaster: #E9ECEA;
      --graphite: #262B2E;
      --lagoon: #4F6F68;
      --stone: #9AA19E;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: var(--plaster);
      color: var(--graphite);
      font-family: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: clamp(24px, 6vw, 80px);
    }
    h1 {
      align-self: end;
      font-weight: 300;
      font-size: clamp(3rem, 12vw, 9rem);
      line-height: 0.9;
      letter-spacing: -0.03em;
    }
    p.subtitle {
      margin-top: 1.2rem;
      font-size: clamp(1rem, 2vw, 1.35rem);
      color: var(--lagoon);
      max-width: 40ch;
    }
    footer {
      margin-top: 4rem;
      padding-top: 1rem;
      border-top: 1px solid var(--stone);
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: var(--stone);
    }
  </style>
</head>
<body>
  <main>
    <h1>StudioLumi</h1>
    <!-- TEST: cambia questa riga, fai commit, e guarda il sito aggiornarsi -->
    <p class="subtitle">Architecture &amp; Development</p>
  </main>
  <footer>
    <span>Treviso, Veneto</span>
    <!-- Cambia il numero di versione a ogni modifica -->
    <span>versione 1</span>
  </footer>
</body>
</html>
